<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Waitlist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f5f6f8;--c:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e3e6eb;--ac:#1d4ed8;--g:#16a34a;--y:#d97706;--r:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
#app{max-width:1120px;margin:0 auto;padding:24px 20px 96px}
h1{font-size:1.5rem;margin:0;font-weight:700;letter-spacing:-.01em}.mu{color:var(--mu);font-size:.86rem}.nw{white-space:nowrap}
.lab{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:20px;display:flex;flex-direction:column}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:6px 0 20px}
.badge{font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:6px;white-space:nowrap}.badge.g{background:#dcfce7;color:#166534}.badge.y{background:#fef3c7;color:#92400e}.badge.r{background:#fee2e2;color:#991b1b}
.big{font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;background:#eceff4;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .8s}.bar.lg{height:10px;margin:14px 0 10px}
button{border:0;border-radius:9px;padding:11px 18px;font:inherit;font-weight:600;background:var(--ac);color:#fff;cursor:pointer}button:hover{filter:brightness(1.08)}
.ghost{background:#e8eefc;color:var(--ac)}.full{width:100%;margin-top:auto}
label{font-size:.8rem;color:var(--mu);display:block;margin:14px 0 4px}input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;font:inherit;background:#fff}
.back{color:var(--ac);cursor:pointer;font-weight:600;font-size:.88rem}
.home{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}.stack{display:grid;gap:12px}
.rt{display:grid;grid-template-columns:205px 1fr 88px 100px;gap:16px;align-items:center;min-height:98px;background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:18px 20px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.rt:hover{border-color:#b9c6ea;box-shadow:0 2px 10px #1d4ed814}
.tm{display:grid;grid-template-columns:64px 1fr 92px;gap:12px;align-items:center}.tm b{display:block;font-size:1.05rem}.tm>div:nth-child(2){white-space:nowrap;text-align:center;font-size:.78rem;color:var(--mu)}.tm>div:nth-child(2) i{display:block;border-top:2px solid var(--bd);margin-top:4px}.tm>div:last-child{text-align:right}
.ch b{display:block;font-size:1.15rem;margin-bottom:6px}
.two,.three{display:grid;gap:20px;align-items:stretch}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
dl{margin:0}dl div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd)}dl div:first-child{border-top:0}dt{color:var(--mu)}dd{margin:0;font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--bd)}td{padding:11px 10px;border-bottom:1px solid #f0f2f5;font-variant-numeric:tabular-nums}tr:last-child td{border:0}
.cta{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:20px;background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:16px 20px}
.chip{align-self:flex-start;font-size:.72rem;font-weight:600;color:var(--ac);background:#e8eefc;border-radius:6px;padding:3px 9px;margin-bottom:12px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--bd);gap:12px}.opt:first-of-type{border-top:0}
.sw{width:44px;height:25px;border-radius:99px;background:#d5dae3;position:relative;cursor:pointer;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ac)}.sw.on:after{left:22px}
nav{position:fixed;z-index:5;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--bd);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav a{flex:1;text-align:center;padding:10px 0;font-size:.85rem;font-weight:500;color:var(--mu);cursor:pointer}nav a.on{color:var(--ac);font-weight:700}.brand{display:none}
@media(min-width:900px){#app{padding-top:92px}nav{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--bd);padding:0 max(24px,calc((100vw - 1080px)/2));align-items:center;gap:4px}
.brand{display:block;margin-right:auto;font-weight:700;font-size:1.05rem}nav a{flex:none;padding:18px 16px;border-bottom:2px solid transparent}nav a.on{border-color:var(--ac)}}
@media(max-width:899px){.home,.two,.three{grid-template-columns:1fr}.rt{grid-template-columns:1fr 1fr;gap:14px}.rt>div:nth-child(1),.rt>div:nth-child(2){grid-column:1/-1}.hc{display:none}.cta{flex-direction:column;align-items:stretch}.cta button{width:100%}}
.sh{font-size:1rem;font-weight:700;margin:28px 0 12px}.row2{display:flex;justify-content:space-between;align-items:center;gap:10px}.tk{cursor:pointer;transition:border-color .15s,box-shadow .15s}.tk:hover{border-color:#b9c6ea;box-shadow:0 2px 10px #1d4ed814}.ft{margin-top:auto;padding-top:14px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:12px}.ft .bar{flex:1}.ft b{width:52px;white-space:nowrap;text-align:right}.tk .tm+.mu{margin-bottom:16px}
.feat{display:grid;grid-template-columns:1.4fr 1fr auto;gap:32px;align-items:center;background:var(--c);border:1px solid var(--bd);border-left:4px solid var(--r);border-radius:12px;padding:22px 24px}@media(max-width:899px){.feat{grid-template-columns:1fr;gap:16px}.ph button{padding:9px 14px}}.md{position:fixed;inset:0;background:#0f172a80;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.mb{background:#fff;border-radius:14px;padding:24px;max-width:440px;width:100%}.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.nt{cursor:pointer}.nt:hover b{color:var(--ac)}.opt>div:first-child{min-width:0;flex:1}input[readonly]{background:#f5f6f8;color:var(--tx)}.lnk{color:var(--ac);font-weight:600;cursor:pointer}</style></head><body><div id="app"></div>
<nav><span class="brand">Smart Waitlist</span><a id="n0" onclick="go('trips')">My Trips</a><a id="n1" onclick="go('check')">Check a ticket</a><a id="n2" onclick="go('alerts')">Alerts</a></nav>
<script>
const $=s=>document.querySelector(s);
const col=p=>p>=70?'var(--g)':p>=40?'var(--y)':'var(--r)';
const est=(wl,d,k=1)=>Math.max(2,Math.min(97,Math.round(100*Math.exp(-wl/(8+1.2*d))*k)));
const KF={SL:1.3,'3A':1,CC:.9,'2A':.7};
const seed={trips:[
{id:1,train:'12635 Vaigai Express',type:'Superfast Express',runs:'Daily',f:'MS',fn:'Chennai Egmore',t:'MDU',tn:'Madurai Jn',date:'Sat, 18 Oct',cls:'3A',st:'WL',n:18,days:6,price:785,stops:[['Chennai Egmore','MS',null,'13:50',0,0],['Tambaram','TBM','14:23','14:25',28,0],['Chengalpattu','CGL','14:48','14:50',56,0],['Villupuram','VM','16:20','16:22',161,0],['Tiruchirappalli','TPJ','18:55','19:00',339,0],['Dindigul','DG','20:08','20:10',421,0],['Madurai Jn','MDU','21:20',null,497,0]]},
{id:2,train:'12661 Pothigai Express',type:'Superfast Express',runs:'Daily',f:'MS',fn:'Chennai Egmore',t:'TEN',tn:'Tirunelveli',date:'Fri, 24 Oct',cls:'SL',st:'RAC',n:12,days:12,price:395,stops:[['Chennai Egmore','MS',null,'19:10',0,0],['Tambaram','TBM','19:43','19:45',28,0],['Villupuram','VM','21:30','21:32',161,0],['Tiruchirappalli','TPJ','00:10','00:15',339,1],['Madurai Jn','MDU','03:30','03:35',497,1],['Virudhunagar','VPT','04:25','04:27',546,1],['Kovilpatti','CVP','05:10','05:12',600,1],['Tirunelveli','TEN','06:05',null,653,1]]},
{id:3,train:'12675 Kovai Express',type:'Superfast Express',runs:'Daily',f:'MAS',fn:'Chennai Central',t:'CBE',tn:'Coimbatore Jn',date:'Mon, 3 Nov',cls:'CC',st:'CNF',n:0,days:22,price:560,stops:[['Chennai Central','MAS',null,'06:15',0,0],['Katpadi Jn','KPD','08:23','08:25',126,0],['Jolarpettai','JTJ','09:20','09:22',216,0],['Salem Jn','SA','10:45','10:50',335,0],['Erode Jn','ED','11:40','11:45',394,0],['Tiruppur','TUP','12:20','12:22',453,0],['Coimbatore Jn','CBE','12:45',null,500,0]]}],
alerts:[{k:'70',l:'My chance reaches 70% or more',on:true},{k:'30',l:'My chance drops below 30%',on:false},{k:'move',l:'My waitlist number moves up 5 spots',on:true},{k:'chart',l:'The chart is prepared',on:false},{k:'conf',l:'My ticket gets confirmed',on:true},{k:'alt',l:'A better alternative becomes available',on:true},{k:'delay',l:'My train is delayed or cancelled',on:false},{k:'rem',l:'24 hours before departure',on:true}],
notes:[
{t:'Waitlist moved up',m:'Your waitlist position on 12635 Vaigai Express (Chennai Egmore to Madurai Jn, 18 Oct) moved from WL 21 to WL 18. Your estimated chance of confirmation is now 31%. We will keep tracking it and alert you if it changes again.',w:'Today, 9:15 AM'},
{t:'Better option found',m:'The next available train from Chennai to Madurai currently shows RAC 9, which gives you about an 86% chance of a seat. Open your ticket and tap "See better options" to compare it with your current booking.',w:'Today, 8:40 AM'},
{t:'Chance went up',m:'The estimated chance for 12661 Pothigai Express (24 Oct) rose to 85% as more RAC tickets moved ahead. No action is needed right now.',w:'Yesterday'},
{t:'Departure reminder',m:'12635 Vaigai Express departs from Chennai Egmore on Sat, 18 Oct at 13:50, in 6 days. Keep a backup option ready while your ticket is still waitlisted.',w:'Yesterday'},
{t:'Train running on time',m:'12675 Kovai Express is currently running on time for its journey on Mon, 3 Nov. We will notify you if there are any delays or cancellations.',w:'2 days ago'},
{t:'Chart preparation',m:'The final reservation chart is usually prepared about 4 hours before departure. We will send you an alert as soon as it is ready and your status is final.',w:'2 days ago'}]};
let S=JSON.parse(localStorage.getItem('sw3')||'null')||seed;S.trips=S.trips.filter(t=>t.stops&&t.stops.length>1);S.notes=S.notes.map(n=>typeof n==='string'?{t:n,m:n,w:'Earlier'}:n);
const save=()=>{localStorage.setItem('sw3',JSON.stringify(S));if(API_OK)fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({vid:VID,state:S})}).catch(()=>{})};
const VID=(()=>{let v=localStorage.getItem('sw_vid');if(!v){v=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);localStorage.setItem('sw_vid',v)}return v})();let API_OK=false;
const clean=()=>{S.trips=S.trips.filter(t=>t.stops&&t.stops.length>1);S.notes=S.notes.map(n=>typeof n==='string'?{t:n,m:n,w:'Earlier'}:n)};
const M=(h,d)=>{const[a,b]=h.split(':');return d*1440+a*60+ +b};
const fmt=m=>Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
const first=t=>t.stops[0],last=t=>t.stops[t.stops.length-1];
const dur=t=>M(last(t)[2],last(t)[5])-M(first(t)[3],first(t)[5]);
const km=t=>last(t)[4];
const rac=(n,d)=>Math.min(94,Math.round(100*Math.exp(-n/(40+3*d))));
const cf=(t,n,d)=>t.st==='RAC'?rac(n,d):est(n,d,KF[t.cls]);
const chance=t=>t.st==='CNF'||t.st==='ALT'?100:cf(t,t.n,t.days);
const lab=t=>t.st==='CNF'?'CONFIRMED':t.st==='ALT'?'SWITCHED':t.st==='RAC'?'RAC '+t.n:'WL '+t.n;
const bcol=t=>t.st==='CNF'||t.st==='ALT'?'var(--g)':t.st==='RAC'?'var(--y)':'var(--r)';

const bc=t=>t.st==='CNF'||t.st==='ALT'?'g':t.st==='RAC'?'y':'r';
function nav(i){[0,1,2].forEach(x=>$('#n'+x).className=x===i?'on':'')}
function go(v,id){window.scrollTo(0,0);({trips,check,alerts,detail,options,save:saveScreen})[v](id)}
function trips(){nav(0);const need=S.trips.filter(t=>t.st==='WL'||t.st==='RAC').sort((a,b)=>chance(a)-chance(b)),w=need[0];
const feat=w?`<div class="feat" style="border-left-color:${col(chance(w))}"><div><div class="lab">Needs your attention</div><b style="font-size:1.15rem">${w.train}</b><div class="mu">${w.fn} → ${w.tn} · ${w.date} · ${lab(w)}</div></div><div><div class="row2"><span class="mu">Confirmation chance</span><b style="font-size:1.4rem;color:${col(chance(w))}">${chance(w)}%</b></div><div class="bar lg" style="margin:10px 0 0"><i style="width:${chance(w)}%;background:${col(chance(w))}"></i></div></div><button onclick="go('options',${w.id})">See better options</button></div>`:'';
$('#app').innerHTML=`<div class="ph"><div><h1>My trips</h1><div class="mu">${S.trips.length} tickets · ${need.length} still need attention</div></div></div>${feat}<div class="sh">Your tickets</div><div class="three">`+S.trips.map(t=>{const c=chance(t);return`<div class="card tk" onclick="go('detail',${t.id})"><div class="row2"><b>${t.train}</b><span class="badge ${bc(t)}">${lab(t)}</span></div><div class="mu" style="margin-top:2px">${t.date} · ${t.cls}${t.alt?' · via '+t.alt:''}${t.prev?` · <span class="lnk" onclick="event.stopPropagation();switchBack(${t.id})">Switch back</span>`:''}</div><div class="tm" style="margin:20px 0 14px"><div><b>${first(t)[3]}</b><span class="mu">${t.f}</span></div><div>${fmt(dur(t))}<i></i></div><div><b>${last(t)[2]}</b><span class="mu">${t.t}${last(t)[5]?' · +1d':''}</span></div></div><div class="mu">${km(t)} km · ${t.stops.length-2} halts</div><div class="ft"><span class="mu">Chance</span><div class="bar"><i style="width:${c}%;background:${col(c)}"></i></div><b style="color:${col(c)}">${c}%</b></div></div>`}).join('')+`</div><div class="sh">Recent alerts</div><div class="three">`+S.notes.slice(0,3).map((n,i)=>`<div class="card tk" onclick="openNote(${i})"><b>${n.t}</b><div class="mu" style="margin:2px 0 8px">${n.w}</div><div class="mu clamp">${n.m}</div><div style="color:var(--ac);font-weight:600;font-size:.84rem;margin-top:10px">Read more →</div></div>`).join('')+`</div>`}
function chart(t){const pts=[];for(let x=t.days;x>=0;x--)pts.push(cf(t,t.n*Math.pow(x/t.days,.7),x));const W=560,H=150,L=34,y=v=>H-14-(v/100)*(H-28),px=i=>L+i*(W-L-8)/(pts.length-1),line=pts.map((v,i)=>px(i)+','+y(v)).join(' ');
return`<svg viewBox="0 0 ${W} ${H}" width="100%">${[0,50,100].map(v=>`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e6eb"/><text x="0" y="${y(v)+4}" font-size="11" fill="#64748b">${v}%</text>`).join('')}<polygon points="${px(0)},${y(0)} ${line} ${px(pts.length-1)},${y(0)}" fill="#1d4ed81a"/><polyline fill="none" stroke="#1d4ed8" stroke-width="2.5" points="${line}"/></svg><div class="row mu" style="display:flex;justify-content:space-between"><span>Today</span><span>Departure</span></div>`}
function detail(id){nav(0);const t=S.trips.find(x=>x.id==id),c=chance(t),D=dur(t),wl=t.st==='WL'||t.st==='RAC';
const rows=t.stops.map(p=>`<tr><td><b>${p[0]}</b> <span class="mu">${p[1]}</span></td><td>${p[2]||'—'}${p[5]&&p[2]?' <small class="mu">+1d</small>':''}</td><td>${p[3]||'—'}${p[5]&&p[3]?' <small class="mu">+1d</small>':''}</td><td class="hc">${p[2]&&p[3]?(M(p[3],p[5])-M(p[2],p[5]))+' min':'—'}</td><td>${p[4]} km</td></tr>`).join('');
const info=[['Type',t.type],['Runs',t.runs],['Class',t.cls],['Journey time',fmt(D)],['Distance',km(t)+' km'],['Average speed',Math.round(km(t)/(D/60))+' km/h'],['Halts',t.stops.length-2]].map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join('');
$('#app').innerHTML=`<div class="back" onclick="go('trips')">← My trips</div><div class="ph"><div><h1>${t.train}</h1><div class="mu">${t.fn} → ${t.tn} · ${t.date}</div></div><span class="badge ${bc(t)}">${lab(t)}</span></div>
${t.st==='ALT'&&t.prev?`<div class="cta" style="margin:0 0 20px"><div><b>You switched to: ${t.alt}</b><div class="mu">Changed your mind? Go back to your original ticket (${t.prev.st==='RAC'?'RAC ':'WL '}${t.prev.n}).</div></div><button class="ghost" onclick="switchBack(${t.id})">Switch back</button></div>`:''}<div class="two"><div class="card"><div class="lab">Confirmation chance</div><div class="big" style="color:${col(c)}">${c}%</div><div class="bar lg"><i id="b" style="background:${col(c)}"></i></div><div class="mu">${c>=70?'Likely to confirm. Keep watching.':c>=40?'Could go either way. Keep a backup ready.':'Unlikely to confirm. Look at better options.'}</div>${wl?`<div class="lab" style="margin-top:22px">Projected until departure</div>${chart(t)}`:''}</div>
<div class="card"><div class="lab">Train information</div><dl>${info}</dl></div></div>
<div class="card" style="margin-top:20px"><div class="lab">Route &amp; timings</div><div class="tw"><table><tr><th>Station</th><th>Arrival</th><th>Departure</th><th class="hc">Halt</th><th>Distance</th></tr>${rows}</table></div></div>
${wl?`<div class="cta"><div><b>Not confident about this ticket?</b></div><button onclick="go('options',${t.id})">See better options →</button></div>`:''}`;setTimeout(()=>{const e=$('#b');if(e)e.style.width=c+'%'},50)}
function options(id){nav(0);const t=S.trips.find(x=>x.id==id),p=chance(t),d=t.days,k=KF[t.cls],D=dur(t),a=Math.max(3,Math.round(t.n*.5)),nb=Math.max(2,Math.round(t.n*.45)),lg=Math.max(1,Math.round(t.n*.25)),mid=t.stops[Math.floor(t.stops.length/2)],nx=t.stops[1],few=t.stops.length<3,e=est(lg,d,k);
let o=[{g:'Alternate train',n:'Next available train',d:'RAC '+a+' · '+fmt(D+50),pr:t.price+90,c:rac(a,d)},{g:'Nearby station',n:'Board at '+(few?'a nearby station':nx[0]),d:'Same train · WL '+nb+(few?'':' · leaves '+nx[3]),pr:t.price,c:est(nb,d,k)},{g:'Split journey',n:'Break at '+(few?'an intermediate station':mid[0]),d:'2 tickets · WL '+lg+' + WL '+lg+' · '+fmt(D+90),pr:t.price+140,c:Math.round(e*e/100)}].filter(x=>x.c>p).sort((a,b)=>b.c-a.c);
$('#app').innerHTML=`<div class="back" onclick="go('detail',${t.id})">← ${t.train}</div><div class="ph"><div><h1>Better options</h1><div class="mu">${t.fn} → ${t.tn} · your chance now ${p}%</div></div></div>`+(o.length?`<div class="three">`+o.map(x=>`<div class="card"><span class="chip">${x.g}</span><b>${x.n}</b><div class="mu" style="margin:4px 0 16px">${x.d}</div><div class="big" style="font-size:2rem;color:${col(x.c)}">${x.c}%</div><div class="mu" style="margin:6px 0 18px">₹${x.pr}</div><button class="ghost full" onclick="pick(${t.id},'${x.n.replace(/'/g,'')}')">Choose this option</button></div>`).join('')+`</div>`:`<div class="card">Your current ticket already has better odds than the alternatives. Stay put.</div>`)}
function check(){nav(1);$('#app').innerHTML=`<div class="ph"><div><h1>Check a ticket</h1></div></div><div class="two"><div class="card"><div class="lab">Ticket details</div><label style="margin-top:0">Class</label><select id="k"><option>SL</option><option selected>3A</option><option>CC</option><option>2A</option></select><label>Waitlist number</label><input id="w" type="number" min="1" placeholder="e.g. 25" oninput="calc()"><label>Days to departure</label><input id="d" type="number" min="0" placeholder="e.g. 8" oninput="calc()"></div><div class="card"><div class="lab">Result</div><div class="big" id="r"></div><div class="bar lg"><i id="b"></i></div><div class="mu" id="m" style="margin-bottom:18px"></div><button class="full" onclick="addT()">Save as a trip</button></div></div>`;$('#k').onchange=calc;calc()}
function alerts(){nav(2);$('#app').innerHTML=`<div class="ph"><div><h1>Alerts</h1></div></div><div class="two"><div class="card"><div class="lab">Notify me when</div>`+S.alerts.map((a,i)=>`<div class="opt"><span>${a.l}</span><div class="sw ${a.on?'on':''}" onclick="tog(${i})"></div></div>`).join('')+`</div><div class="card"><div class="lab">Recent notifications</div>`+S.notes.slice(0,5).map((n,i)=>`<div class="opt nt" onclick="openNote(${i})"><div><b>${n.t}</b> <span class="mu">· ${n.w}</span><div class="mu clamp" style="margin-top:3px">${n.m}</div></div><span class="mu">›</span></div>`).join('')+`</div></div><div class="cta"><div><b>Restore sample data</b><div class="mu">Clears the tickets you added, the options you chose and your alert settings, and brings back the original demo data.</div></div><button class="ghost" onclick="if(confirm('Restore the original sample data?')){localStorage.removeItem('sw3');(API_OK?fetch('/api/state?vid='+VID,{method:'DELETE'}):Promise.resolve()).catch(()=>{}).finally(()=>location.reload())}">Restore sample data</button></div>`}
function switchBack(id){const t=S.trips.find(x=>x.id==id);if(!t||!t.prev)return;t.st=t.prev.st;t.n=t.prev.n;delete t.prev;delete t.alt;S.notes.unshift({t:'Switched back',m:'You switched '+t.train+' back to your original ticket ('+lab(t)+'). We are tracking its confirmation chance again.',w:'Just now'});save();go('detail',id)}
function pick(id,n){const t=S.trips.find(x=>x.id==id);t.prev={st:t.st,n:t.n};t.st='ALT';t.alt=n;S.notes.unshift({t:'Ticket switched',m:'You switched '+t.train+' to: '+n+'. In this demo your seat is now treated as confirmed.',w:'Just now'});save();go('trips')}
function calc(){const w=$('#w').value,d=$('#d').value;if(w===''||d===''||+w<1||+d<0){$('#r').textContent='—';$('#r').style.color='var(--mu)';$('#b').style.width='0%';$('#m').textContent='Enter your waitlist number and days left to see the chance';return false}const c=est(+w,+d,KF[$('#k').value]);$('#r').textContent=c+'%';$('#r').style.color=col(c);$('#b').style.width=c+'%';$('#b').style.background=col(c);$('#m').textContent=c>=70?'Likely to confirm':c>=40?'50-50, keep a backup':'Unlikely, check alternatives';
if(API_OK)fetch('/api/chance?cls='+$('#k').value+'&wl='+w+'&days='+d).then(r=>r.json()).then(j=>{if(j.chance!=null&&$('#r')&&$('#w').value===w&&$('#d').value===d){const c2=j.chance;$('#r').textContent=c2+'%';$('#r').style.color=col(c2);$('#b').style.width=c2+'%';$('#b').style.background=col(c2)}}).catch(()=>{});return true}
let DR=null;
function addT(){if(!calc())return;DR={cls:$('#k').value,n:+$('#w').value,days:+$('#d').value};go('save')}
const TR=[['12635','Vaigai Express','13:50'],['12661','Pothigai Express','19:10'],['12675','Kovai Express','06:15'],['12631','Nellai Express','19:45'],['12633','Kanyakumari Express','17:25'],['12637','Pandian Express','21:40'],['12693','Pearl City Express','21:00'],['12653','Rockfort Express','22:30'],['12605','Pallavan Express','15:45']];
const ST=[['Chennai Egmore',13.0789,80.2606],['Chennai Central',13.0827,80.2757],['Tambaram',12.9249,80.1],['Chengalpattu',12.6921,79.9757],['Villupuram Jn',11.939,79.493],['Katpadi Jn',12.969,79.137],['Salem Jn',11.6643,78.146],['Erode Jn',11.341,77.7172],['Tiruppur',11.1085,77.3411],['Coimbatore Jn',10.999,76.966],['Tiruchirappalli Jn',10.8095,78.6845],['Thanjavur Jn',10.787,79.1378],['Karaikudi Jn',10.0736,78.78],['Dindigul Jn',10.3673,77.9803],['Madurai Jn',9.9195,78.1193],['Virudhunagar Jn',9.585,77.957],['Kovilpatti',9.171,77.868],['Tirunelveli Jn',8.7139,77.7567],['Nagercoil Jn',8.1833,77.4119],['Kanyakumari',8.0883,77.5385],['Rameswaram',9.2876,79.3129]];
const ymd=x=>{const z=n=>String(n).padStart(2,'0');return x.getFullYear()+'-'+z(x.getMonth()+1)+'-'+z(x.getDate())};const daysTo=v=>Math.round((new Date(v+'T00:00')-new Date(ymd(new Date())+'T00:00'))/864e5);
function fillT(){const ni=$('#sn').value,k=+$('#sk').value;if(ni===''||!(k>0))return;const p=TR[ni][2].split(':').map(Number),a=p[0]*60+p[1],b=(a+Math.round(k/62*12)*5)%1440,f=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');$('#sdp').value=f(a);$('#sa').value=f(b)}
function syncT(src){const v=$('#'+src).value;$('#sn').value=v;$('#sm').value=v;fillT()}
function dist(){const f=$('#sf').value,t=$('#sto').value,o=$('#sk');if(f===''||t===''){o.value='';$('#sdp').value='';$('#sa').value='';o.placeholder='Appears after you choose both stations';return}
if(f===t){o.value='';$('#sdp').value='';$('#sa').value='';o.placeholder='Choose two different stations';return}
const a=ST[f],b=ST[t],r=x=>x*Math.PI/180,h=Math.sin(r(b[1]-a[1])/2)**2+Math.cos(r(a[1]))*Math.cos(r(b[1]))*Math.sin(r(b[2]-a[2])/2)**2;
o.value=Math.round(2*6371*Math.asin(Math.sqrt(h))*1.18);fillT()}
const opts=(a,f)=>a.map((x,i)=>`<option value="${i}">${f(x)}</option>`).join('');
function saveScreen(){nav(1);const d=DR;if(!d)return check();$('#app').innerHTML=`<div class="back" onclick="go('check')">← Back to check</div><div class="ph"><div><h1>Save as a trip</h1></div></div><div class="two"><div class="card"><div class="lab">Train</div><label style="margin-top:0">Train number</label><select id="sn" onchange="syncT('sn')"><option value="">Select train number</option>${opts(TR,x=>x[0])}</select><label>Train name</label><select id="sm" onchange="syncT('sm')"><option value="">Select train name</option>${opts(TR,x=>x[1])}</select><label>From station</label><select id="sf" onchange="dist()"><option value="">Select station</option>${opts(ST,x=>x[0])}</select><label>To station</label><select id="sto" onchange="dist()"><option value="">Select station</option>${opts(ST,x=>x[0])}</select></div><div class="card"><div class="lab">Journey</div><label style="margin-top:0">Travel date</label><input id="sd" type="date" oninput="dchg()"><label>Departure time</label><input id="sdp" type="time"><label>Arrival time</label><input id="sa" type="time"><label>Distance (km, approximate)</label><input id="sk" readonly placeholder="Appears after you choose both stations"></div></div><div class="cta"><div><b id="dl">${d.cls} · WL ${d.n} · ${d.days} days to departure</b><div class="mu" id="dc">From your check · estimated chance ${est(d.n,d.days,KF[d.cls])}%</div></div><button onclick="saveT()">Save trip</button></div><div id="err" style="color:var(--r);margin-top:12px;font-size:.88rem"></div>`;const t0=new Date();t0.setDate(t0.getDate()+d.days);$('#sd').value=ymd(t0);$('#sd').min=ymd(new Date())}
function dchg(){const v=$('#sd').value;if(!v)return;const n=daysTo(v);if(n<0)return;DR.days=n;$('#dl').textContent=DR.cls+' · WL '+DR.n+' · '+n+' days to departure';$('#dc').textContent='From your check · estimated chance '+est(DR.n,Math.max(1,n),KF[DR.cls])+'%'}
function saveT(){const ni=$('#sn').value,fi=$('#sf').value,ti=$('#sto').value,dt=$('#sd').value,dp=$('#sdp').value,ar=$('#sa').value,k=+$('#sk').value;
if(ni===''||fi===''||ti===''||!dt||!dp||!ar){$('#err').textContent='Please fill in every field before saving.';return}
if(daysTo(dt)<0){$('#err').textContent='Please choose a travel date that is today or later.';return}
if(fi===ti||!(k>0)){$('#err').textContent='Please choose two different stations.';return}
const num=TR[ni][0],nm=TR[ni][1],f=ST[fi][0],t=ST[ti][0],code=x=>x.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase(),ds=new Date(dt).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).replace(/^(\w+) /,'$1, ');
S.trips.push({id:Date.now(),train:num+' '+nm,type:'Express',runs:'Not specified',f:code(f),fn:f,t:code(t),tn:t,date:ds,cls:DR.cls,st:'WL',n:DR.n,days:Math.max(1,DR.days),price:Math.round(k*1.6),stops:[[f,code(f),null,dp,0,0],[t,code(t),ar,null,k,ar<dp?1:0]]});
S.notes.unshift({t:'Trip saved',m:'You saved '+num+' '+nm+' ('+f+' to '+t+', '+ds+'). We will track its confirmation chance and notify you when it changes.',w:'Just now'});save();DR=null;go('trips')}
function openNote(i){const n=S.notes[i],m=document.createElement('div');m.className='md';m.onclick=e=>{if(e.target===m)m.remove()};m.innerHTML=`<div class="mb"><div class="lab">Notification · ${n.w}</div><h2 style="margin:0 0 10px;font-size:1.15rem">${n.t}</h2><p style="margin:0 0 20px;line-height:1.55">${n.m}</p><button onclick="this.closest('.md').remove()">Close</button></div>`;document.body.appendChild(m)}
function tog(i){const a=S.alerts[i];a.on=!a.on;if(a.on)S.notes.unshift({t:'Alert turned on',m:'You will be notified when: '+a.l.charAt(0).toLowerCase()+a.l.slice(1)+'. We will send a notification as soon as it happens.',w:'Just now'});save();alerts()}
(async()=>{try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),2500),h=await fetch('/api/health',{signal:c.signal});clearTimeout(tm);if(h.ok&&(await h.json()).ok){API_OK=true;const r=await fetch('/api/state?vid='+VID);if(r.ok){S=await r.json();clean()}else save()}}catch(e){}trips()})();
</script></body></html>
